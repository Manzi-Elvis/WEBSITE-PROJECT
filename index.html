<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./dist/output.css">
    <title>Website project template</title>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">  
</head>
<body>
    <div id="header"></div>
    <div id="hero"></div>
    <div id="whitesection"></div>
    <div id="contact"></div>
    <div id="footer"></div>

    <script>
        const loadComponents = (id, url) => {
            fetch(url)
            .then((response) => response.text())
            .then((html) => {
                document.getElementById(id).innerHTML = html;
            });
        }

        window.onload = () => {
            loadComponents('header', 'src/sections/header.html');
            loadComponents('hero', 'src/sections/hero.html');
            loadComponents('whitesection', 'src/sections/whitesection.html');
            loadComponents('contact', 'src/sections/contact.html');
            loadComponents('footer', 'src/sections/footer.html');
        }
    </script>
</body>
</html>
