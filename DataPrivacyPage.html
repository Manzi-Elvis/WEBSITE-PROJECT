    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="/dist/output.css">
        <title>Website project template</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Outfit:wght@100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
            rel="stylesheet">
    </head>
    <script>
        const loadComponents = (id, url) =>  {
            fetch(url)
            .then((response) => response.text())
            .then((html) => {
                document.getElementById(id).innerHTML = html;
            });
        }

        window.onload = () => {
            loadComponents('header', 'src/sections/header.html');
            loadComponents('dataprivacy', 'src/sections/DataPrivacy.html');
            loadComponents('footer', 'src/sections/footer.html');
        }
    </script>
    <body class="bg-[#EFECEA]">
        <div id="header" class="text-[#00672E] bg-[#EFECEA]"></div>
        <div id="dataprivacy" class="text-[#00672E]"></div>
        <div id="footer" class="text-[#00672E] bg-[#EFECEA]"></div>
    </body>
    </html>
